name: Cloudflare Workers

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish this validated main/dev revision to the existing Cloudflare Worker'
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  # Reuse the exact branch/SHA guards for every CI provider, including detached checkouts.
  WORKERS_CI: '1'
  WORKERS_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  WORKERS_CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Static assets for Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned deployment tooling
        run: npm ci
      - name: Test and assemble the exact checked-out revision
        run: npm run build:cloudflare
      - name: Validate Wrangler configuration without publishing
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-check"
      - name: Explain a validation-only manual run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.deploy != true || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'))
        run: echo "Validation only. Publication requires an explicit deploy request on main or dev." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ github.ref_name == 'main' && 'production' || 'dev Preview' }}
    needs: validate
    if: >-
      github.repository == 'sinikebe/finapp' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check deployment credentials without displaying them
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare publication skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            echo "Validation passed. **No Cloudflare deployment:** repository Actions secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are missing. Configure them, then run this workflow on main/dev with deploy enabled." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
              echo "::error::Manual deployment requested but Cloudflare Actions secrets are missing."
              exit 1
            fi
          elif [ "$CLOUDFLARE_ACCOUNT_ID" != 'bbc2341709439fad81d7aebc62efb873' ]; then
            echo "::error::The configured account does not match the existing Finapp Worker account."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ignore a superseded push
        id: revision
        if: steps.credentials.outputs.ready == 'true'
        run: |
          current=$(git ls-remote --exit-code origin "refs/heads/$WORKERS_CI_BRANCH" | cut -f1)
          if [ "$current" = "$WORKERS_CI_COMMIT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "No deployment: this push was superseded by a newer branch revision." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
              echo "::error::The selected branch revision changed. Request a new manual deployment."
              exit 1
            fi
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Install pinned deployment tooling
        if: steps.revision.outputs.current == 'true'
        run: npm ci
      - name: Rebuild and verify the pushed branch and revision
        if: steps.revision.outputs.current == 'true'
        run: npm run build:cloudflare
      - name: Publish only the current production or dev revision
        id: deploy
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current=$(git ls-remote --exit-code origin "refs/heads/$WORKERS_CI_BRANCH" | cut -f1)
          if [ "$current" != "$WORKERS_CI_COMMIT_SHA" ]; then
            echo "No deployment: the branch changed during the build." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
              echo "::error::The selected branch revision changed. Request a new manual deployment."
              exit 1
            fi
            exit 0
          fi
          case "$WORKERS_CI_BRANCH" in
            main) npm run deploy:cloudflare ;;
            dev) npm run preview:cloudflare -- --name dev ;;
            *) echo "::error::Only main and dev can publish from GitHub."; exit 1 ;;
          esac
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify the public deployment revision
        if: steps.deploy.outputs.published == 'true'
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          const branch = process.env.WORKERS_CI_BRANCH;
          const origin = branch === 'main' ? 'https://finapp.siniverse.cc/' : 'https://dev.finapp.siniverse.cc/';
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(new URL('deployment.json', origin), { cache: 'no-store', signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const manifest = await response.json();
              if (manifest.app !== 'finapp' || manifest.sourceBranch !== branch
                  || manifest.environment !== branch || manifest.revision !== process.env.WORKERS_CI_COMMIT_SHA) {
                throw new Error('The public revision has not propagated yet.');
              }
              await appendFile(process.env.GITHUB_STEP_SUMMARY, `Published [${branch}](${origin}) at ${manifest.revision}.\n`);
              process.exit(0);
            } catch (error) {
              if (attempt === 5) throw error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
