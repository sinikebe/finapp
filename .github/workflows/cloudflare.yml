name: Cloudflare Pages

on:
  # Safe build-only validation on dev and in PRs, before this file reaches main.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # Both events below require this workflow file on the default branch (main).
  workflow_run:
    workflows: [CI]
    branches: [main, dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Previously tested revision to redeploy
        type: choice
        options: [main, dev]
        default: dev
        required: true

permissions:
  contents: read

# A newer push may finish CI before an older run starts. Serialize each branch,
# then check the actual branch head again before making any deployment.
concurrency:
  group: cloudflare-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build a non-published preview without Cloudflare credentials
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          node tools/build-cloudflare.mjs --branch "$BRANCH" --domain example.test --out "$RUNNER_TEMP/cloudflare-check"
          test -s "$RUNNER_TEMP/cloudflare-check/index.html"
          test -s "$RUNNER_TEMP/cloudflare-check/sw.js"

  deploy:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - name: Select the current tested revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DOMAIN: ${{ vars.SUITE_DOMAIN }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" == main || "$BRANCH" == dev ]] || { echo 'Unexpected branch'; exit 1; }
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo 'Configure SUITE_DOMAIN'; exit 1; }
          [[ "$PROJECT" =~ ^[a-z0-9-]+$ ]] || { echo 'Configure CLOUDFLARE_PROJECT'; exit 1; }
          head=$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')
          if [[ "$TRIGGER" == workflow_run && "$head" != "$TESTED_SHA" ]]; then
            echo 'A newer revision exists; leave deployment to its own successful CI.'
            exit 0
          fi
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&branch=$BRANCH&event=push&status=success&per_page=10" --jq '.total_count')
          [[ "$passed" -ge 1 ]] || { echo 'This exact branch revision has no successful push CI'; exit 1; }
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.revision.outputs.sha != ''
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.revision.outputs.sha != ''
        with:
          node-version: '22'
      - name: Build the exact tested revision
        if: steps.revision.outputs.sha != ''
        env:
          BRANCH: ${{ steps.revision.outputs.branch }}
          DOMAIN: ${{ vars.SUITE_DOMAIN }}
        run: node tools/build-cloudflare.mjs --branch "$BRANCH" --domain "$DOMAIN" --out "$RUNNER_TEMP/finapp-static"
      - name: Check for a newer revision before publishing
        if: steps.revision.outputs.sha != ''
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.revision.outputs.branch }}
          TESTED_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          head=$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')
          if [[ "$head" == "$TESTED_SHA" ]]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.current.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/finapp-static --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=${{ steps.revision.outputs.branch }}
          gitHubToken: ${{ github.token }}
