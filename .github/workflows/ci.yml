name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish main or the stable dev Preview after validation
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  version:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
      pull-requests: read
    uses: sinikebe/siniverse/.github/workflows/reusable-version.yml@0b44f1ce54f877f75f1d4d04901d86def2c7543a
    with:
      automation_ref: 0b44f1ce54f877f75f1d4d04901d86def2c7543a
      deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
  ci:
    needs: version
    if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.action != 'closed') && (needs.version.result == 'skipped' || (needs.version.result == 'success' && needs.version.outputs.current == 'true'))
    permissions:
      contents: read
      pull-requests: read
    uses: sinikebe/siniverse/.github/workflows/reusable-ci.yml@0b44f1ce54f877f75f1d4d04901d86def2c7543a
    with:
      automation_ref: 0b44f1ce54f877f75f1d4d04901d86def2c7543a
      deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
      version: ${{ needs.version.outputs.version }}
      version_tag: ${{ needs.version.outputs.tag }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && secrets.CLOUDFLARE_API_TOKEN || '' }}
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == false
    permissions:
      contents: write
      pull-requests: read
    uses: sinikebe/siniverse/.github/workflows/reusable-cleanup.yml@0b44f1ce54f877f75f1d4d04901d86def2c7543a
    with:
      automation_ref: 0b44f1ce54f877f75f1d4d04901d86def2c7543a
